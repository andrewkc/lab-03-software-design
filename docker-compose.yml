services:
  postgres:
    image: postgres:15-alpine
    container_name: lab03-postgres
    environment:
      POSTGRES_DB: lab03
      POSTGRES_USER: lab03
      POSTGRES_PASSWORD: lab03
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab03 -d lab03"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: lab03-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lab03
      SPRING_DATASOURCE_USERNAME: lab03
      SPRING_DATASOURCE_PASSWORD: lab03
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: