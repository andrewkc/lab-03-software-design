spring.application.name=software-design-lab

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lab03}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lab03}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lab03}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
server.port=${SERVER_PORT:8080}