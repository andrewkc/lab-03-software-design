<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesion | Lab 03</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <p class="eyebrow">LABORATORIO 03</p>
    <h1>Panel de administracion</h1>
    <p class="muted">Ingresa tus credenciales para continuar.</p>
    <div class="alert error" th:if="${param.error}">Usuario o contrasena incorrectos.</div>
    <div class="alert success" th:if="${param.logout}">Sesion cerrada correctamente.</div>
    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" required autofocus>
        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" required>
        <button class="button primary" type="submit">Ingresar</button>
    </form>
    <p class="hint">Demo: admin / admin123</p>
</main>
</body>
</html>
