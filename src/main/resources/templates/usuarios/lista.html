<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Lab 03</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="topbar">
    <div><span class="eyebrow">LABORATORIO 03</span><strong>Administracion</strong></div>
    <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button ghost" type="submit">Cerrar sesion</button></form>
</header>
<main class="container">
    <div class="heading-row">
        <div><p class="eyebrow">DIRECTORIO</p><h1>Usuarios registrados</h1></div>
        <a class="button primary" th:href="@{/usuarios/nuevo}">+ Nuevo usuario</a>
    </div>
    <section class="table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Usuario</th><th>Rol</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td><td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.email}"></td><td th:text="${usuario.username}"></td>
                <td><span class="tag" th:text="${usuario.rol}"></span></td>
                <td class="actions"><a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                    <form method="post" th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}" onsubmit="return confirm('¿Eliminar este usuario?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="link danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}"><td class="empty" colspan="6">No hay usuarios registrados.</td></tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
